<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" font-family="'JetBrains Mono','Consolas',monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#12241a"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#9fef00" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="620" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="618" rx="14" fill="none" stroke="#1c2430" stroke-width="2"/>

  <!-- window chrome -->
  <circle cx="34" cy="34" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="34" r="7" fill="#ffbd2e"/>
  <circle cx="82" cy="34" r="7" fill="#27c93f"/>
  <rect x="26" y="24" width="30" height="20" rx="5" fill="#9fef00"/>
  <text x="41" y="39" text-anchor="middle" fill="#0a0e16" font-size="14" font-weight="700">E</text>
  <text x="640" y="39" text-anchor="middle" fill="#5b6675" font-size="14">EntraHuntKit — Hunting Console</text>
  <line x1="16" y1="58" x2="1264" y2="58" stroke="#1c2430"/>

  <!-- faux query + result behind the play button -->
  <text x="40" y="104" fill="#9fef00" font-size="17">AuditLogs</text>
  <text x="40" y="132" fill="#8a94a6" font-size="17">| <tspan fill="#9fef00">where</tspan> OperationName <tspan fill="#9fef00">has</tspan> <tspan fill="#e3b341">"Consent to application"</tspan></text>
  <text x="40" y="160" fill="#8a94a6" font-size="17">| <tspan fill="#9fef00">extend</tspan> TargetApp = tostring(TargetResources[<tspan fill="#79c0ff">0</tspan>].displayName)</text>

  <rect x="40" y="470" width="1200" height="118" rx="8" fill="#0f1420" stroke="#1c2430"/>
  <text x="60" y="500" fill="#5b6675" font-size="13">TimeGenerated            Actor                    TargetApp</text>
  <line x1="60" y1="512" x2="1220" y2="512" stroke="#1c2430"/>
  <rect x="48" y="524" width="1184" height="34" fill="#1a0f10"/>
  <rect x="48" y="524" width="3" height="34" fill="#ff5f56"/>
  <text x="60" y="547" fill="#e6edf3" font-size="14">2026-08-04 09:14:22   j.doe@contoso.com        <tspan fill="#ff5f56">Mail Backup Pro  &#9888; suspicious</tspan></text>
  <text x="60" y="578" fill="#5b6675" font-size="12">scopes: Mail.ReadWrite, Mail.Send, offline_access   ·   1 high-severity match</text>

  <!-- play button -->
  <circle cx="640" cy="300" r="62" fill="#9fef00" filter="url(#ds)"/>
  <path d="M620 268 L620 332 L676 300 Z" fill="#0a0e16"/>
  <text x="640" y="404" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700" font-family="'Outfit',sans-serif">Watch the walkthrough</text>
  <text x="640" y="434" text-anchor="middle" fill="#9fef00" font-size="15">48 seconds · click to play</text>
</svg>
